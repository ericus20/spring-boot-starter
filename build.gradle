import org.gradle.process.CommandLineArgumentProvider

abstract class MockitoAgentArgumentProvider implements CommandLineArgumentProvider {
  @Classpath
  abstract ConfigurableFileCollection getAgentClasspath()

  @Override
  Iterable<String> asArguments() {
    ["-javaagent:${agentClasspath.singleFile.absolutePath}"]
  }
}

plugins {
  id 'org.springframework.boot' version '4.1.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.owasp.dependencycheck' version '13.0.0'
  id 'com.diffplug.spotless' version '8.10.2'
  id 'eclipse'
  id 'jacoco'
  id 'idea'
  id 'java'
}

group = 'com.developersboard'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(26)
  }
  // You can uncomment this to include javadoc jar generation
  //  withJavadocJar()

  // You can comment this line to exclude source jar
  withSourcesJar()
}

configurations {
  mockitoAgent {
    canBeConsumed = false
    transitive = false
  }
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

ext {
  set('jjwtVersion', '0.13.0')
  set('springDocVersion', '3.1.0')
  set('javadocScribeVersion', '0.15.0')
  set('mapstructVersion', '1.6.3')
  set('awsSdkS3Version', '2.54.9')
  set('jsoupVersion', '1.21.2')
  set('commonsIoVersion', '2.22.0')
  set('datafakerVersion', '2.7.0')
  set('gsonVersion', '2.14.0')
  set('commonsValidatorVersion', '1.11.0')
  set('springDataJpaDataTablesVersion', '8.0.0')
}

dependencies {
  mockitoAgent 'org.mockito:mockito-core'

  implementation 'org.springframework.boot:spring-boot-h2console'
  implementation 'org.springframework.boot:spring-boot-starter-mail'
  implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-data-rest'
  implementation 'org.springframework.boot:spring-boot-starter-validation'

  // Dev Tools
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

  implementation 'com.github.ben-manes.caffeine:jcache'
  implementation 'org.hibernate.orm:hibernate-jcache'

  // Utilities
  implementation 'org.jspecify:jspecify'
  implementation "org.jsoup:jsoup:${jsoupVersion}"
  implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
  runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
  runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
  implementation "commons-io:commons-io:${commonsIoVersion}"
  implementation "net.datafaker:datafaker:${datafakerVersion}"
  implementation "com.google.code.gson:gson:${gsonVersion}"
  implementation "commons-validator:commons-validator:${commonsValidatorVersion}"
  implementation "com.github.darrachequesne:spring-data-jpa-datatables:${springDataJpaDataTablesVersion}"

  // Documentation and API Tools
  implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"
  annotationProcessor "com.github.therapi:therapi-runtime-javadoc-scribe:${javadocScribeVersion}"
  runtimeOnly "com.github.therapi:therapi-runtime-javadoc:${javadocScribeVersion}"

  // Database and File Storage Tools
  implementation 'com.h2database:h2'
  runtimeOnly 'org.postgresql:postgresql'
  implementation 'org.springframework.boot:spring-boot-starter-liquibase'
  implementation 'org.hibernate.orm:hibernate-envers'
  implementation "software.amazon.awssdk:s3:${awsSdkS3Version}"
  // Supply a Hibernate 7-compatible licensed optimizer JAR when profiling is needed.
  if (providers.gradleProperty('hypersistenceOptimizerJar').isPresent()) {
    runtimeOnly files(providers.gradleProperty('hypersistenceOptimizerJar').get())
  }

  // MapStruct for Object Mapping
  implementation "org.mapstruct:mapstruct:${mapstructVersion}"
  annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

  // Webjars
  implementation 'org.webjars:jquery:3.7.1'
  implementation 'org.webjars:bootstrap:5.3.5'
  implementation 'org.webjars:jquery-ui:1.14.1'
  implementation 'org.webjars:datatables:2.3.0'
  implementation 'org.webjars:font-awesome:6.7.2'
  implementation 'org.webjars:webjars-locator:0.52'
}

testing {
  //noinspection GroovyAssignabilityCheck
  suites {
    configureEach {
      useJUnitJupiter()

      dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        implementation 'com.icegreen:greenmail-junit5:2.1.7'
        implementation 'com.jparams:to-string-verifier:1.4.8'
        implementation 'nl.jqno.equalsverifier:equalsverifier:4.0'
        implementation 'org.springframework.security:spring-security-test'
        implementation 'org.springframework.boot:spring-boot-starter-test'
        runtimeOnly 'org.junit.platform:junit-platform-launcher'
      }
    }
    //noinspection GroovyAssignabilityCheck
    integrationTest(JvmTestSuite) {
      sources.java.srcDirs = ['src/integrationTest/java']
      sources.resources.srcDirs = ['src/integrationTest/resources']
      dependencies {
        implementation project()
        implementation sourceSets.test.output

        implementation 'com.adobe.testing:s3mock:5.0.0'
        implementation 'org.springframework.boot:spring-boot-testcontainers'
        implementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
        implementation "software.amazon.awssdk:s3:${awsSdkS3Version}"
        implementation 'org.testcontainers:testcontainers-junit-jupiter'
        implementation 'org.testcontainers:testcontainers-postgresql'
      }
      targets {
        configureEach {
          testTask.configure {
            shouldRunAfter(test)
            finalizedBy 'jacocoTestReport'
            // Default to the local integration-test profile.
            environment 'SPRING_PROFILES_ACTIVE', System.getenv("SPRING_PROFILES_ACTIVE") ?: "integration-test"
          }
        }
      }
    }
  }
}

configurations {
  integrationTestImplementation.extendsFrom testImplementation
}

tasks.named('check') {
  dependsOn(testing.suites.integrationTest, tasks.named('spotlessCheck'))
}

tasks.named('bootBuildImage') {
  builder = 'paketobuildpacks/builder-jammy-base:latest'
}

tasks.withType(Test).configureEach {
  jvmArgumentProviders.add(objects.newInstance(MockitoAgentArgumentProvider).tap {
    agentClasspath.from(configurations.mockitoAgent)
  })
  // Mockito instruments bootstrap classes; CDS cannot be used by these test JVMs.
  jvmArgs '-Xshare:off'
  // Spring Security's CSRF test helper replaces a final field on its filter.
  jvmArgs '--enable-final-field-mutation=ALL-UNNAMED'
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs += ['-Xlint:deprecation']
}

jacocoTestReport {
  executionData(fileTree(layout.buildDirectory).include("jacoco/*.exec"))
  reports {
    xml.required = true
    html.required = true
    csv.required = true
  }

  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: [
          "**/exception/*",
          "**/enums/*",
          "**/constant/*",
          "**/config/*",
          "**/backend/bootstrap/*",
          "**/Mock*.class",
          "**/*DtoMapperImpl.class",
      ])
    }))
  }
}

spotless {
  format 'misc', {
    // define the files to apply `misc` to
    target '*.gradle', '*.md', '.gitignore'

    // define the steps to apply to those files
    trimTrailingWhitespace()
    leadingTabsToSpaces()
    endWithNewline()
  }

  java {

    // define the steps to apply to those files
    trimTrailingWhitespace()
    leadingTabsToSpaces()
    endWithNewline()
    removeUnusedImports()
  }
}
